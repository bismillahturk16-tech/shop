name: for_shop
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_launcher_icons: ^0.14.4
  shamsi_date: ^1.1.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  local_auth: ^3.0.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  # The foreground already carries its own padding for the launcher safe zone.
  adaptive_icon_background: "assets/images/icon_bg.png"
  adaptive_icon_foreground: "assets/images/icon_fg.png"
  adaptive_icon_foreground_inset: 0
